<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Job Board{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/jobs/">💼 JobBoard</a>
        <div class="ms-auto d-flex align-items-center">
            <a href="/jobs/" class="btn btn-sm btn-outline-light me-2">Jobs</a>

            <span id="navRecruiter" style="display:none;">
                <a href="/recruiter/" class="btn btn-sm btn-outline-light me-2">Dashboard</a>
            </span>

            <span id="navApplicant" style="display:none;">
                <a href="/my-applications/" class="btn btn-sm btn-outline-light me-2">My Applications</a>
            </span>

            <span id="navGuest">
                <a href="/login/" class="btn btn-sm btn-outline-light me-2">Login</a>
                <a href="/register/" class="btn btn-sm btn-warning">Register</a>
            </span>

            <span id="navUser" style="display:none;">
                <span class="text-light small me-2" id="navUsername"></span>
                <button onclick="logout()" class="btn btn-sm btn-outline-danger">Logout</button>
            </span>
        </div>
    </div>
</nav>

<div class="container py-5">
    {% block content %}{% endblock %}
</div>

<footer class="text-center text-muted py-4 small">
    © 2024 JobBoard — Built with Django & Bootstrap
</footer>

<script>
// Shared nav logic across all pages
const _token = localStorage.getItem('access');
const _role = localStorage.getItem('role');
const _username = localStorage.getItem('username');

if (_token) {
    document.getElementById('navGuest').style.display = 'none';
    document.getElementById('navUser').style.display = 'inline';
    document.getElementById('navUsername').innerText = _username;

    if (_role === 'recruiter') {
        document.getElementById('navRecruiter').style.display = 'inline';
    } else if (_role === 'applicant') {
        document.getElementById('navApplicant').style.display = 'inline';
    }
}

function logout() {
    localStorage.clear();
    window.location.href = '/login/';
}
</script>

</body>
</html>
