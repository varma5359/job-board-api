{% extends 'base.html' %}
{% block title %}Jobs{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold">💼 Available Jobs</h2>
    <span class="text-muted small">Browse and apply</span>
</div>

<div id="jobs" class="row g-3"></div>

<!-- ================= APPLY MODAL ================= -->
<div class="modal fade" id="applyModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content rounded-4 border-0">
      <div class="modal-header">
        <h5 class="modal-title">
          Apply for <span id="modalJobTitle" class="fw-bold"></span>
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <input type="hidden" id="modalJobId">

        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Full Name <span class="text-danger">*</span></label>
            <input id="fullName" class="form-control" placeholder="Your full name">
          </div>

          <div class="col-md-6">
            <label class="form-label">Email <span class="text-danger">*</span></label>
            <input id="email" type="email" class="form-control" placeholder="you@example.com">
          </div>

          <div class="col-md-6">
            <label class="form-label">Phone <span class="text-danger">*</span></label>
            <input id="phone" class="form-control" placeholder="9876543210">
          </div>

          <div class="col-md-6">
            <label class="form-label">Current Location <span class="text-danger">*</span></label>
            <input id="location" class="form-control" placeholder="City">
          </div>

          <div class="col-md-6">
            <label class="form-label">Years of Experience <span class="text-danger">*</span></label>
            <input id="experience" type="number" min="0" max="60" value="0" class="form-control">
          </div>

          <div class="col-md-6">
            <label class="form-label">Skills <span class="text-danger">*</span></label>
            <input id="skills" class="form-control" placeholder="Python, Django, SQL">
          </div>

          <div class="col-12">
            <label class="form-label">Cover Letter <span class="text-danger">*</span></label>
            <textarea id="coverLetter" class="form-control" rows="3"
                      placeholder="Why are you a good fit?"></textarea>
          </div>

          <div class="col-12">
            <label class="form-label">Resume (PDF / DOC, max 5MB)</label>
            <input type="file" id="resumeFile" class="form-control"
                   accept=".pdf,.doc,.docx">
            <div class="form-text">Optional, but recommended.</div>
          </div>
        </div>

        <p id="applyMsg" class="small mt-3 mb-0"></p>
      </div>

      <div class="modal-footer">
        <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button onclick="submitApplication()" class="btn btn-dark">Submit Application</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
const token = localStorage.getItem('access');
const role = localStorage.getItem('role');

/* ---------------- LOAD JOBS ---------------- */
async function loadJobs() {
    const res = await fetch('/api/jobs/');
    const data = await res.json();
    const container = document.getElementById('jobs');

    if (data.data.length === 0) {
        container.innerHTML =
            '<p class="text-muted">No jobs available yet. Recruiters can post from the Dashboard.</p>';
        return;
    }

    container.innerHTML = data.data.map(job => `
        <div class="col-md-6">
            <div class="card shadow-sm border-0 rounded-4 h-100">
                <div class="card-body">
                    <h5 class="fw-bold">${job.title}</h5>
                    <p class="text-muted mb-1 small">🏢 ${job.company} &nbsp; 📍 ${job.location}</p>
                    <p class="mb-2 small">${job.description}</p>
                    <span class="badge bg-success-subtle text-success-emphasis">${job.salary || 'Negotiable'}</span>
                    <hr>
                    <button onclick="openApplyModal(${job.id}, '${job.title.replace(/'/g, "\\'")}')"
                            class="btn btn-sm btn-dark w-100">Apply Now</button>
                </div>
            </div>
        </div>
    `).join('');
}

/* ---------------- OPEN MODAL ---------------- */
function openApplyModal(jobId, jobTitle) {
    if (!token) { window.location.href = '/login/'; return; }
    if (role !== 'applicant') { alert('Only applicants can apply.'); return; }

    document.getElementById('modalJobId').value = jobId;
    document.getElementById('modalJobTitle').innerText = jobTitle;

    // Pre-fill from localStorage username (nice touch)
    const username = localStorage.getItem('username') || '';
    document.getElementById('fullName').value = '';
    document.getElementById('email').value = '';
    document.getElementById('phone').value = '';
    document.getElementById('location').value = '';
    document.getElementById('experience').value = 0;
    document.getElementById('skills').value = '';
    document.getElementById('coverLetter').value = '';
    document.getElementById('resumeFile').value = '';
    document.getElementById('applyMsg').innerHTML = '';

    new bootstrap.Modal(document.getElementById('applyModal')).show();
}

/* ---------------- SUBMIT APPLICATION ---------------- */
async function submitApplication() {
    const jobId = document.getElementById('modalJobId').value;
    const msg = document.getElementById('applyMsg');

    const fullName = document.getElementById('fullName').value.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const location = document.getElementById('location').value.trim();
    const experience = document.getElementById('experience').value;
    const skills = document.getElementById('skills').value.trim();
    const cover = document.getElementById('coverLetter').value.trim();
    const file = document.getElementById('resumeFile').files[0];

    // Client-side validation
    if (!fullName || !email || !phone || !location || !skills || !cover) {
        msg.innerHTML = '<span class="text-danger">Please fill all required fields.</span>';
        return;
    }
    if (!/^\S+@\S+\.\S+$/.test(email)) {
        msg.innerHTML = '<span class="text-danger">Please enter a valid email.</span>';
        return;
    }
    if (phone.replace(/\D/g, '').length < 10) {
        msg.innerHTML = '<span class="text-danger">Phone must have at least 10 digits.</span>';
        return;
    }
    if (file && file.size > 5 * 1024 * 1024) {
        msg.innerHTML = '<span class="text-danger">Resume must be under 5MB.</span>';
        return;
    }

    // Build FormData
    const formData = new FormData();
    formData.append('full_name', fullName);
    formData.append('email', email);
    formData.append('phone', phone);
    formData.append('location', location);
    formData.append('experience_years', experience);
    formData.append('skills', skills);
    formData.append('cover_letter', cover);
    if (file) formData.append('resume', file);

    msg.innerHTML = '<span class="text-muted">Submitting...</span>';

    const res = await fetch(`/api/jobs/${jobId}/apply/`, {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token },
        body: formData
    });
    const data = await res.json();

    if (res.ok) {
        msg.innerHTML = '<span class="text-success">Application submitted!</span>';
        setTimeout(() => {
            bootstrap.Modal.getInstance(document.getElementById('applyModal')).hide();
        }, 900);
    } else {
        let errMsg = data.message || 'Failed';
        if (data.errors) {
            const firstKey = Object.keys(data.errors)[0];
            if (firstKey) errMsg = `${firstKey}: ${data.errors[firstKey][0]}`;
        }
        msg.innerHTML = '<span class="text-danger">' + errMsg + '</span>';
    }
}

loadJobs();
</script>
{% endblock %}
